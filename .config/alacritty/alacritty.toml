[general]
live_config_reload = true
working_directory = "None"
ipc_socket = true
import = [
  "~/.config/alacritty/themes/midnight-mint.toml"
]

[env]
TERM = "xterm-256color"

[window]
opacity = 0.95
decorations = "None"
dynamic_padding = false
title = "Alacritty"

[window.padding]
x = 10
y = 10

# --------------- FONT SETTINGS ---------------
[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

[scrolling]
history = 65535
multiplier = 3

[cursor]
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking = "On"

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[colors.primary]
foreground = "#bcbec4"
