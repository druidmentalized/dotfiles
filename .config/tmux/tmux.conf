# ==============================================================================
# --- Functionality --- 
# ==============================================================================

# Rebind Prefix to Ctrl-a 
set-option -g prefix C-a 
unbind C-b 
bind C-a send-prefix 

# Start all numbering at 1 instead of 0
set-option -g base-index 1 
set-option -g pane-base-index 1 

# Allow for automatic renumbering of windows
set -g renumber-windows on 

# Set double borders (Modern tmux feature)
set -g pane-border-lines "double" 

# Enable mouse support 
set -g mouse on
# unbind -n MouseDrag1Pane
# unbind -T copy-mode-vi MouseDrag1Pane

# Increase history limit
set-option -g history-limit 100000 


# Enable vi-like controls
setw -g mode-keys vi 
bind-key -T copy-mode-vi v send-keys -X begin-selection 

# Clipboard Support (different on other systems)
set -s set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Allow modern escape sequences to pass through
set -g allow-passthrough on 

# Fix terminal title display
set-option -g set-titles on 
set-option -g set-titles-string "#{pane_title}" 

# Sophisticated terminal features
set-option -g focus-events on 
set-option -s extended-keys on 

# Remove waiting time for escape (Essential for Neovim)
set-option -s escape-time 0 

# ==============================================================================
# --- Binds --- 
# ==============================================================================

unbind -n M-c 
unbind -n M-'\' 
unbind -n M-'-' 

bind -n M-c new-window 
bind -n M-'\' split-window -h -c "#{pane_current_path}" 
bind -n M-'-' split-window -v -c "#{pane_current_path}" 

# Smart resizing 
bind -r M-h resize-pane -L 1 
bind -r M-j resize-pane -D 1 
bind -r M-k resize-pane -U 1 
bind -r M-l resize-pane -R 1 

# Repeat time for binds (1 second)
set-option -g repeat-time 1000 

# Window selection
bind -n M-1 select-window -t 1 
bind -n M-2 select-window -t 2 
bind -n M-3 select-window -t 3 
bind -n M-4 select-window -t 4 
bind -n M-5 select-window -t 5 
bind -n M-6 select-window -t 6 
bind -n M-7 select-window -t 7 
bind -n M-8 select-window -t 8 
bind -n M-9 select-window -t 9 

# Copy mode & Session management
bind -n M-'`' copy-mode 
bind -n M-d detach 
bind -n M-q kill-pane 
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session 
bind -n M-s choose-tree -s 

# Config reload 
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!" 

# Smart switching with Vim splits awareness
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'" 

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}'   '' 'select-pane -L' } 
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' } 
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}'    '' 'select-pane -U' } 
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}'  '' 'select-pane -R' } 

# Recover C-l clear screen functionality
bind C-l send-keys "C-l" 

# ==============================================================================
# --- Styling & Terminal Fixes --- 
# ==============================================================================

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:256"
set -as terminal-features ",xterm-256color:clipboard"

# Add 'strinkethrough' and 'italics' support for modern terminals
set -as terminal-overrides ',xterm*:smxx=\E[9m'

# Transparency and Status bar
set -g status-style "bg=default" 
set -g visual-activity off 

# The main status bar background (Deep Purple/Dark Obsidian)
# set -g status-style "bg=#0f0f17,fg=#c0caf5"
set -g status-style "bg=default"

# Active window tab (Mint Green background with Dark text)
set-window-option -g window-status-current-style "bg=#73daca,fg=#0f0f17,bold"
set-window-option -g window-status-current-format " #I:#W "

# Inactive window tabs (Subtle Purple)
set-window-option -g window-status-style "fg=#565f89"
set-window-option -g window-status-format " #I:#W "

# Pane borders (Active = Mint, Inactive = Deep Purple)
set -g pane-active-border-style "fg=#73daca"
set -g pane-border-style "fg=#292e42"

# Message text (e.g., when you reload config)
set -g message-style "bg=#bb9af7,fg=#0f0f17,bold"

# Right side of status bar 
set -g status-right ""

# The "Copy Mode" indicator in the top right
set -g mode-style "bg=#bb9af7,fg=#0f0f17,bold"

# When you highlight text in copy mode
# This uses a saturated purple for the background of selected text
setw -g mode-style "bg=#bb9af7,fg=#0f0f17"

# If you want the search highlights (when pressing / in copy mode) to be purple too:
set -g copy-mode-match-style "bg=#565f89,fg=#ffffff"
set -g copy-mode-current-match-style "bg=#bb9af7,fg=#0f0f17,bold"

# ==============================================================================
# --- TMUX Plugins ---  
# ==============================================================================

set -g @plugin 'tmux-plugins/tpm' 
set -g @plugin 'tmux-plugins/tmux-resurrect' 
set -g @plugin 'tmux-plugins/tmux-continuum' 

# Persistence settings 
set -g @continuum-restore 'on' 
set -g @resurrect-strategy-nvim 'session' 
set -g @resurrect-capture-pane-contents 'on' 

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
